<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1220" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ xếp quân ban đầu Cờ Tư Lệnh</title>
<desc id="desc">Quân đặt trên giao điểm của 11 cột và 12 hàng. Dải nước màu xanh ở mép trái và giữa bàn.</desc>
<rect width="1220" height="1220" fill="#f8f5ec"/>
<text x="135" y="55" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#263c3a">SƠ ĐỒ XẾP QUÂN BAN ĐẦU</text>
<text x="135" y="89" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64736c">Nhìn từ phía Đỏ • 19 quân mỗi bên • quân đứng trên giao điểm</text>
<g transform="translate(135 140) scale(0.95 0.81)">
  <title id="title">Địa hình bàn Cờ Tư Lệnh</title>
  <desc id="desc">Mười khoảng ngang và mười một khoảng dọc. Nước ở dải ven trái và dải ngang giữa bàn; có hai cầu tại cột F và H.</desc>
  <defs>
    <linearGradient id="land" x2="0" y2="1"><stop stop-color="#f9f5eb"/><stop offset="1" stop-color="#eee9dd"/></linearGradient>
    <linearGradient id="water" x2="1" y2="1"><stop stop-color="#afe8f0"/><stop offset="1" stop-color="#8ed8e7"/></linearGradient>
  </defs>
  <rect width="1000" height="1100" fill="url(#land)"/>
  <path d="M0 0H200V1100H0Z M0 500H1000V600H0Z" fill="url(#water)"/>
  <path d="M200 0V500 M200 600V1100 M0 500H1000 M0 600H1000" fill="none" stroke="#b98854" stroke-width="3" opacity=".7"/>
  <path d="M486 500H514V600H486Z M686 500H714V600H686Z" fill="#ecd8a5" opacity=".95"/>
